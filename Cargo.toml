[package]
name = "actix-crud-admin"
version = "0.2.0"
edition = "2021"
description = "Auto-generated CRUD admin for Actix-web 4, with pluggable auth"
license = "AGPL-3.0"
repository = "https://github.com/TincoNomad/actix-crud-admin"
homepage = "https://github.com/TincoNomad/actix-crud-admin"
documentation = "https://docs.rs/actix-crud-admin"
readme = "README.md"
keywords = ["actix", "admin", "crud", "web", "panel"]
categories = ["web-programming", "web-programming::http-server"]
authors = ["TincoNomad (@tincoNomad)"]

[dependencies]
actix-web = "4"
actix-session = { version = "0.9", features = ["cookie-session"] }
argon2 = "0.5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dialoguer = "0.11"
log = "0.4"
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
] }

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls"]

[[bin]]
name = "admin-cli"
path = "src/bin/admin-cli.rs"

[[bin]]
name = "createsuperuser"
path = "src/bin/createsuperuser.rs"

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
actix-http = "3"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "tls-rustls",
] }
